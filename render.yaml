services:
  # 1. FastAPI Python Backend
  - type: web
    name: forceflow-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: development
      - key: APP_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@example.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: ForceFlowAdmin2026!
      - key: DATABASE_URL
        fromDatabase:
          name: forceflow-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://forceflow-web.onrender.com"

  # 2. Next.js Frontend
  - type: web
    name: forceflow-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: forceflow-api
          property: host
        value: https://${forceflow-api.host}/api/v1

databases:
  - name: forceflow-db
    plan: free
    region: oregon
    databaseName: orbitops
    user: orbitops
