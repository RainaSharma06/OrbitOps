services:
  # 1. FastAPI Python Backend
  - type: web
    name: orbitops-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: development
      - key: APP_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@example.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: OrbitOpsAdmin2026!
      - key: DATABASE_URL
        fromDatabase:
          name: orbitops-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://orbitops-web.onrender.com"
      - key: PORT
        value: 8000

  # 2. Next.js Frontend
  - type: web
    name: orbitops-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://orbitops-api.onrender.com/api/v1
      - key: API_INTERNAL_URL
        value: https://orbitops-api.onrender.com/api/v1

databases:
  - name: orbitops-db
    plan: free
    region: oregon
    databaseName: orbitops
    user: orbitops
